services:
  app:
    build:
      context: ./infra/php
      dockerfile: ./Dockerfile
      # 以下のargsセクションを追加 [1, 2]
      args:
        - UID=${LOCAL_UID:-1000}
        - GID=${LOCAL_GID:-1000}
    volumes:
      - ./src:/data

  web:
    image: nginx:1.20-alpine
    ports:
      - 8080:80
    volumes:
      - ./src:/data
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    working_dir: /data

  db:
    build: ./infra/mysql
    volumes:
      - db-store:/var/lib/mysql
    ports:
      - 3306:3306
  node:
    image: node:22-alpine
    volumes:
      - ./front:/app        # front/ ディレクトリをマウント
    working_dir: /app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - web
volumes:
  db-store:
